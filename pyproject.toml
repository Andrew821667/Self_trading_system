[project]
name = "trading-system"
version = "0.1.0"
description = "Autonomous agentic trading system (TZ v2.0 FINAL) — event-driven equity strategies gated by a deterministic Risk Engine and Safety Plane."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
